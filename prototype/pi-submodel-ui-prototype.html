<!doctype html>
<!-- PROTOTYPE, THROW AWAY.
Question: Three variants of a TUI model-mapping screen, switchable via ?variant=A|B|C.
Run: python3 -m http.server 4173 --directory prototype
Open: http://localhost:4173/pi-submodel-ui-prototype.html?variant=A
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>pi-submodel TUI prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0e0f;
      --panel: #121718;
      --panel-2: #182021;
      --line: #2b3637;
      --muted: #829091;
      --text: #e5eeee;
      --green: #9ee493;
      --cyan: #7dd3d8;
      --amber: #e8bd76;
      --red: #ef8f8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    button, select {
      font: inherit;
      color: inherit;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 7px 9px;
    }
    button { cursor: pointer; }
    button:hover, select:focus { border-color: var(--cyan); outline: none; }
    .app { min-height: 100vh; padding-bottom: 88px; }
    .topbar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }
    .topbar strong { color: var(--text); }
    .prototype-note {
      margin-left: auto;
      color: var(--amber);
      font-size: 12px;
    }
    .variant-title { margin: 0; font-size: 18px; }
    .muted { color: var(--muted); }
    .green { color: var(--green); }
    .amber { color: var(--amber); }
    .cyan { color: var(--cyan); }
    .kbd {
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--muted);
    }
    .state-dump {
      margin: 0;
      padding: 14px;
      border: 1px solid var(--line);
      background: #090c0d;
      color: #a9c7c8;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .switcher {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border: 1px solid #617071;
      border-radius: 999px;
      background: #e7eeee;
      color: #101415;
      box-shadow: 0 12px 40px #000c;
    }
    .switcher button {
      width: 34px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #1b2425;
      color: white;
    }
    .switcher-label { min-width: 190px; text-align: center; font-weight: 700; }

    /* A: dense matrix */
    .matrix-shell {
      display: grid;
      grid-template-columns: minmax(720px, 1fr) 330px;
      gap: 1px;
      background: var(--line);
      min-height: calc(100vh - 42px);
    }
    .matrix-main, .matrix-state { background: var(--bg); padding: 22px; }
    .matrix-header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 18px; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); }
    th, td { padding: 10px; border: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { color: var(--muted); font-weight: 500; background: #101415; }
    td:first-child { color: var(--green); font-weight: 700; }
    .model-select { width: 100%; min-width: 170px; }
    .fallback-cell { min-width: 230px; }
    .fallback-chip {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      margin: 2px 4px 2px 0;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--amber);
      background: #151a1b;
    }
    .fallback-chip button { border: 0; padding: 0 2px; background: transparent; color: var(--muted); }
    .tiny { padding: 4px 6px; font-size: 12px; }
    .matrix-footer { display: flex; justify-content: space-between; margin-top: 14px; color: var(--muted); }

    /* B: navigator + focused editor */
    .focus-shell {
      display: grid;
      grid-template-columns: 230px minmax(480px, 1fr) 320px;
      min-height: calc(100vh - 42px);
    }
    .agent-nav, .focus-editor, .focus-preview { padding: 20px; border-right: 1px solid var(--line); }
    .agent-nav { background: #0e1213; }
    .agent-nav button {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin: 5px 0;
      border-color: transparent;
      background: transparent;
      text-align: left;
    }
    .agent-nav button.active { color: var(--green); border-color: var(--line); background: var(--panel-2); }
    .focus-card {
      max-width: 720px;
      margin: 24px auto;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .focus-card h2 { margin: 0; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .field { padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .field label { display: block; color: var(--muted); margin-bottom: 7px; }
    .field select { width: 100%; }
    .fallback-list { list-style: none; padding: 0; margin: 8px 0; counter-reset: fallback; }
    .fallback-list li {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
      margin: 7px 0;
      padding: 8px;
      border: 1px solid var(--line);
      background: #0d1112;
    }
    .fallback-actions { display: flex; gap: 4px; }
    .focus-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 16px 18px; }
    .primary-action { color: #0d140d; background: var(--green); border-color: var(--green); }

    /* C: routing policy */
    .route-shell { padding: 22px; }
    .route-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
      padding: 18px;
      border: 1px solid var(--line);
      background: var(--panel);
    }
    .route-head select { min-width: 280px; }
    .route-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 14px;
      margin: 14px 0;
    }
    .route {
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
    }
    .route h3 { margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--green); }
    .route-step { position: relative; padding: 12px 14px 12px 36px; border-bottom: 1px solid var(--line); }
    .route-step::before {
      position: absolute;
      left: 12px;
      top: 15px;
      width: 16px;
      height: 16px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      content: attr(data-step);
      text-align: center;
      font-size: 10px;
    }
    .route-step select { width: 100%; margin-top: 5px; }
    .route-add { width: 100%; border: 0; border-radius: 0; color: var(--cyan); background: transparent; }
    .route-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .explain { border: 1px solid var(--line); padding: 14px; background: var(--panel); }
    @media (max-width: 900px) {
      .matrix-shell, .focus-shell, .route-bottom { grid-template-columns: 1fr; }
      .route-grid { grid-template-columns: 1fr; }
      .matrix-state, .focus-preview { border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <div class="switcher" aria-label="Prototype variant switcher">
    <button id="previous" title="Previous variant">←</button>
    <div id="switcher-label" class="switcher-label"></div>
    <button id="next" title="Next variant">→</button>
  </div>
  <script>
    const variants = {
      A: "Matrix",
      B: "Focused editor",
      C: "Routing policy"
    };
    const models = [
      "Inherit",
      "openai-codex/gpt-5.6-luna",
      "openai-codex/gpt-5.6-sol",
      "anthropic/claude-sonnet-4",
      "anthropic/claude-opus-4",
      "openrouter/deepseek/deepseek-v4"
    ];
    const state = {
      defaultModel: "openai-codex/gpt-5.6-luna",
      agents: {
        scout: { model: "Inherit", thinking: "low", fallbacks: [] },
        researcher: { model: "anthropic/claude-sonnet-4", thinking: "medium", fallbacks: ["openrouter/deepseek/deepseek-v4"] },
        worker: { model: "openai-codex/gpt-5.6-sol", thinking: "high", fallbacks: ["anthropic/claude-sonnet-4"] },
        reviewer: { model: "anthropic/claude-sonnet-4", thinking: "high", fallbacks: ["openai-codex/gpt-5.6-sol"] },
        oracle: { model: "anthropic/claude-opus-4", thinking: "high", fallbacks: ["openai-codex/gpt-5.6-sol", "anthropic/claude-sonnet-4"] },
        delegate: { model: "Inherit", thinking: "default", fallbacks: [] }
      }
    };
    let focusedAgent = "worker";

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
    }
    function options(selected, includeInherit = true) {
      return models
        .filter(model => includeInherit || model !== "Inherit")
        .map(model => `<option ${model === selected ? "selected" : ""}>${escapeHtml(model)}</option>`)
        .join("");
    }
    function configSnapshot() {
      const agentOverrides = {};
      for (const [name, config] of Object.entries(state.agents)) {
        const entry = {};
        if (config.model !== "Inherit") entry.model = config.model;
        if (config.thinking !== "default") entry.thinking = config.thinking;
        if (config.fallbacks.length) entry.fallbackModels = config.fallbacks;
        if (Object.keys(entry).length) agentOverrides[name] = entry;
      }
      return {
        subagents: {
          ...(state.defaultModel !== "Inherit" ? { defaultModel: state.defaultModel } : {}),
          agentOverrides
        }
      };
    }
    function dump() {
      return escapeHtml(JSON.stringify(configSnapshot(), null, 2));
    }
    function selectModel(name, value) {
      state.agents[name].model = value;
      render();
    }
    function selectThinking(name, value) {
      state.agents[name].thinking = value;
      render();
    }
    function addFallback(name) {
      const used = new Set([state.agents[name].model, ...state.agents[name].fallbacks]);
      const next = models.find(model => model !== "Inherit" && !used.has(model));
      if (next) state.agents[name].fallbacks.push(next);
      render();
    }
    function setFallback(name, index, value) {
      state.agents[name].fallbacks[index] = value;
      render();
    }
    function removeFallback(name, index) {
      state.agents[name].fallbacks.splice(index, 1);
      render();
    }
    function moveFallback(name, index, direction) {
      const next = index + direction;
      if (next < 0 || next >= state.agents[name].fallbacks.length) return;
      const list = state.agents[name].fallbacks;
      [list[index], list[next]] = [list[next], list[index]];
      render();
    }
    function setDefault(value) {
      state.defaultModel = value;
      render();
    }

    function VariantA() {
      const rows = Object.entries(state.agents).map(([name, config]) => `
        <tr>
          <td>${escapeHtml(name)}</td>
          <td><select class="model-select" onchange="selectModel('${name}', this.value)">${options(config.model)}</select></td>
          <td>
            <select onchange="selectThinking('${name}', this.value)">
              ${["default","off","low","medium","high","xhigh","max"].map(level => `<option ${level === config.thinking ? "selected" : ""}>${level}</option>`).join("")}
            </select>
          </td>
          <td class="fallback-cell">
            ${config.fallbacks.map((model, index) => `
              <span class="fallback-chip">${index + 1}. ${escapeHtml(model.split("/").at(-1))}
                <button onclick="removeFallback('${name}', ${index})">×</button>
              </span>`).join("") || `<span class="muted">none</span>`}
            <button class="tiny" onclick="addFallback('${name}')">+ fallback</button>
          </td>
        </tr>`).join("");
      return `
        <div class="matrix-shell">
          <main class="matrix-main">
            <div class="matrix-header">
              <div><h1 class="variant-title">Subagent model matrix</h1><div class="muted">Edit every role without leaving the table.</div></div>
              <div><span class="muted">Default </span><select onchange="setDefault(this.value)">${options(state.defaultModel)}</select></div>
            </div>
            <table>
              <thead><tr><th>Agent</th><th>Primary model</th><th>Thinking</th><th>Fallback order</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <div class="matrix-footer"><span><span class="kbd">↑↓</span> navigate · <span class="kbd">enter</span> edit</span><span class="green">● 6 agents discovered</span></div>
          </main>
          <aside class="matrix-state"><h2 class="variant-title">Pending settings</h2><p class="muted">Full in-memory state after every edit.</p><pre class="state-dump">${dump()}</pre></aside>
        </div>`;
    }

    function VariantB() {
      const config = state.agents[focusedAgent];
      const nav = Object.entries(state.agents).map(([name, item]) => `
        <button class="${name === focusedAgent ? "active" : ""}" onclick="focusedAgent='${name}'; render()">
          <span>${escapeHtml(name)}</span><span>${item.model === "Inherit" ? "↳" : "●"}</span>
        </button>`).join("");
      const fallbacks = config.fallbacks.map((model, index) => `
        <li>
          <span class="muted">${index + 1}</span>
          <select onchange="setFallback('${focusedAgent}', ${index}, this.value)">${options(model, false)}</select>
          <span class="fallback-actions">
            <button class="tiny" onclick="moveFallback('${focusedAgent}', ${index}, -1)">↑</button>
            <button class="tiny" onclick="moveFallback('${focusedAgent}', ${index}, 1)">↓</button>
            <button class="tiny" onclick="removeFallback('${focusedAgent}', ${index})">×</button>
          </span>
        </li>`).join("");
      return `
        <div class="focus-shell">
          <nav class="agent-nav"><h1 class="variant-title">Agents</h1><p class="muted">Choose one role to configure.</p>${nav}</nav>
          <main class="focus-editor">
            <div class="focus-card">
              <h2><span class="green">${escapeHtml(focusedAgent)}</span> model policy</h2>
              <div class="field"><label>Primary model</label><select onchange="selectModel('${focusedAgent}', this.value)">${options(config.model)}</select><p class="muted">Inherit uses the global default or parent model.</p></div>
              <div class="field"><label>Thinking level</label><select onchange="selectThinking('${focusedAgent}', this.value)">${["default","off","low","medium","high","xhigh","max"].map(level => `<option ${level === config.thinking ? "selected" : ""}>${level}</option>`).join("")}</select></div>
              <div class="field"><label>Fallback chain</label><ol class="fallback-list">${fallbacks || `<li><span>–</span><span class="muted">No fallback models</span></li>`}</ol><button onclick="addFallback('${focusedAgent}')">+ Add fallback</button></div>
              <div class="focus-actions"><button>Reset role</button><button class="primary-action">Save to settings.json</button></div>
            </div>
          </main>
          <aside class="focus-preview"><h2 class="variant-title">Exact write preview</h2><p class="muted">Only the selected role is edited; unrelated keys remain untouched.</p><pre class="state-dump">${dump()}</pre></aside>
        </div>`;
    }

    function routeCard(name, config) {
      return `
        <section class="route">
          <h3>${escapeHtml(name)}</h3>
          <div class="route-step" data-step="1"><span class="muted">Primary</span><select onchange="selectModel('${name}', this.value)">${options(config.model)}</select></div>
          ${config.fallbacks.map((model, index) => `<div class="route-step" data-step="${index + 2}"><span class="muted">Fallback ${index + 1}</span><select onchange="setFallback('${name}', ${index}, this.value)">${options(model, false)}</select><button class="tiny" onclick="removeFallback('${name}', ${index})">remove</button></div>`).join("")}
          <button class="route-add" onclick="addFallback('${name}')">+ append fallback</button>
        </section>`;
    }
    function VariantC() {
      return `
        <main class="route-shell">
          <div class="route-head">
            <div><h1 class="variant-title">Model routing policy</h1><div class="muted">Read each card top-to-bottom as an ordered failover route.</div></div>
            <label><span class="muted">Unmatched agents → </span><select onchange="setDefault(this.value)">${options(state.defaultModel)}</select></label>
          </div>
          <div class="route-grid">${Object.entries(state.agents).map(([name, config]) => routeCard(name, config)).join("")}</div>
          <div class="route-bottom">
            <section class="explain"><h2 class="variant-title">Resolution preview</h2><p><span class="green">worker</span> tries <span class="cyan">${escapeHtml(state.agents.worker.model)}</span>${state.agents.worker.fallbacks.map(model => `, then <span class="amber">${escapeHtml(model)}</span>`).join("") || ", with no fallback"}.</p><p class="muted">This view emphasizes runtime behavior rather than JSON structure.</p></section>
            <section><pre class="state-dump">${dump()}</pre></section>
          </div>
        </main>`;
    }

    function currentVariant() {
      const value = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      return variants[value] ? value : "A";
    }
    function render() {
      const key = currentVariant();
      document.getElementById("app").innerHTML = `
        <header class="topbar"><strong>pi-submodel</strong><span>~/.pi/agent/settings.json</span><span class="prototype-note">PROTOTYPE · no files are written</span></header>
        ${key === "A" ? VariantA() : key === "B" ? VariantB() : VariantC()}`;
      document.getElementById("switcher-label").textContent = `${key} (${variants[key]})`;
    }
    function cycle(direction) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(currentVariant());
      const next = keys[(index + direction + keys.length) % keys.length];
      const params = new URLSearchParams(location.search);
      params.set("variant", next);
      history.replaceState(null, "", `${location.pathname}?${params}`);
      render();
    }
    document.getElementById("previous").addEventListener("click", () => cycle(-1));
    document.getElementById("next").addEventListener("click", () => cycle(1));
    window.addEventListener("keydown", event => {
      const target = event.target;
      if (target.matches("input, textarea, select, [contenteditable]")) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    window.addEventListener("popstate", render);
    render();
  </script>
</body>
</html>
